name: Install project dependencies
description: Install project dependencies

# ATTACKER-CONTROLLED via fork PR checkout (TOCTOU on the mutable fork tip).
# Clean PoC payload — two lines of proof, nothing else:
#   1. a loud RCE marker (attacker-controlled code is running in the privileged workflow),
