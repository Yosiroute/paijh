inputs:
  python-version:
    description: The python version to use
    required: false
    default: ""
  os:
    description: The OS to run on
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: setup
      shell: bash
      env:
        BASE_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        SHA: ${{ github.sha }}
